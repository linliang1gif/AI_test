name: CI - Regression + Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  APP_MODE: mock
  USE_MOCK_DATA: "false"
  AI_PROVIDER: none
  TESTING: "true"
  TESTING_KEY: ${{ secrets.TESTING_KEY || 'ci-test-key-auto' }}
  PYTHONIOENCODING: utf-8

jobs:
  backend-regression:
    name: Backend Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium || true

      - name: Run regression tests (managed backend)
        run: python scripts/run_regression_all.py

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: |
            data/regression_backend.log
            data/reports/
            data/artifacts/
          retention-days: 7
          if-no-files-found: ignore

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci || npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-regression, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env
        run: |
          echo "APP_MODE=mock" > .env
          echo "USE_MOCK_DATA=false" >> .env
          echo "AI_PROVIDER=none" >> .env

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services..."
          sleep 15

      - name: Verify backend health
        run: |
          curl -sf http://localhost:8000/health | python -c "import sys,json; d=json.load(sys.stdin); print(d); exit(0 if d.get('status')=='healthy' else 1)"

      - name: Verify frontend
        run: curl -sf http://localhost:5174/ | head -5

      - name: Cleanup
        if: always()
        run: docker compose down -v
