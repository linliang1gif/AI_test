[pytest]
# AI Test Platform 主线扫描范围
# 只扫描仓库根的 tests/ 与 scripts/ 下的真实活动测试
# legacy/归档/被测系统副本一律忽略
testpaths = tests/regression
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

norecursedirs =
    archive
    docs
    docs/archive
    docs/frontend
    tests/legacy
    recycle-*
    蓝点
    ai测试
    node_modules
    dist
    build
    coverage
    .vite
    frontend/dist
    frontend/build
    frontend/.vite
    data
    uploads
    output
    logs
    reports
    chroma_db
    __pycache__
    .pytest_cache
    .mypy_cache
    venv
    .venv
    env

# 默认安静一点；真实信息打到 logs/regression*.log
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning